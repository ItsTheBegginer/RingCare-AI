version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r backend/requirements.txt
run:
  runtime-version: "3.11"
  command: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: PORT
  env:
    - name: STORAGE_BACKEND
      value: dynamodb
    - name: VISION_BACKEND
      value: rekognition
    - name: CLIPS_BACKEND
      value: s3
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
    - name: PYTHONUNBUFFERED
      value: "1"
